<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Artikel | Admin BLINKCO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F72585',
                        textMain: '#111827',
                        textMuted: '#6B7280',
                        bgMain: '#FFFFFF',
                        bgAlt: '#F9FAFB',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-montserrat text-textMain bg-bgAlt">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 h-screen fixed left-0 top-0 flex flex-col z-20">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <a href="dashboard.html" class="font-poppins font-bold text-2xl tracking-wide text-textMain">
                BLINK<span class="text-primary">CO</span> <span class="text-xs font-bold text-textMuted ml-1 uppercase tracking-wider">Admin</span>
            </a>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mt-6 mb-2">Management</p>
            <a href="kelola-produk.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Produk
            </a>
            <a href="kelola-transaksi.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Transaksi
            </a>
            <a href="kelola-artikel.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                Artikel
            </a>
            <a href="kelola-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Pengguna
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 min-h-screen">
        <!-- Top Header -->
        <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="font-poppins font-bold text-xl text-textMain">Kelola Artikel</h2>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
                    <div class="w-10 h-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-sm">A</div>
                    <div class="hidden md:block">
                        <p class="text-sm font-bold text-textMain leading-tight">Admin Andy</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">Daftar Artikel</h3>
                    <p class="text-sm text-textMuted font-medium mt-1">Manage news and updates.</p>
                </div>
                <button onclick="document.getElementById('modalArtikel').classList.remove('hidden')" class="bg-primary text-white font-semibold py-2.5 px-5 rounded-xl hover:bg-[#e01970] transition-colors shadow-sm flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Tulis Artikel
                </button>
            </div>

            <!-- Table Card -->
            <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-bgAlt border-b border-gray-100 text-xs uppercase tracking-wider text-textMuted font-bold">
                                <th class="px-6 py-4">Judul Artikel</th>
                                <th class="px-6 py-4">Kategori</th>
                                <th class="px-6 py-4">Tanggal Post</th>
                                <th class="px-6 py-4">Penulis</th>
                                <th class="px-6 py-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="article-table-body" class="divide-y divide-gray-100 font-medium text-sm">
                            <tr><td colspan="5" class="text-center py-4 text-textMuted">Loading articles...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Tambah Artikel -->
    <div id="modalArtikel" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-bgAlt">
                <h3 class="font-poppins font-bold text-lg text-textMain">Tulis Artikel Baru</h3>
                <button onclick="document.getElementById('modalArtikel').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="addArticleForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-textMain">Judul Artikel</label>
                    <input type="text" name="title" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-bgAlt text-sm font-medium">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-textMain">Kategori</label>
                        <select name="category" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-bgAlt text-sm font-medium">
                            <option>Music</option>
                            <option>Fashion</option>
                            <option>Interviews</option>
                            <option>Community</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-textMain">Penulis</label>
                        <input type="text" name="author" value="Editorial Team" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-bgAlt text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-textMain">URL Gambar</label>
                    <input type="text" name="image_url" placeholder="https://..." class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-bgAlt text-sm font-medium">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-textMain">Isi Konten</label>
                    <textarea name="content" required rows="4" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-bgAlt text-sm font-medium resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="document.getElementById('modalArtikel').classList.add('hidden')" class="px-5 py-2.5 border border-gray-200 rounded-xl font-semibold text-textMuted hover:bg-gray-50 transition-colors">Batal</button>
                    <button type="submit" class="px-5 py-2.5 bg-primary text-white rounded-xl font-semibold hover:bg-[#e01970] transition-colors shadow-sm">Publikasikan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function fetchArticles() {
            fetch('../api/get_articles.php')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('article-table-body');
                    if (!data.success || data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-textMuted">No articles found.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = '';
                    data.data.forEach(article => {
                        const date = article.created_at
                            ? new Date(article.created_at).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' })
                            : '-';
                        tbody.insertAdjacentHTML('beforeend', `
                        <tr class="hover:bg-gray-50 transition-colors" id="article-row-${article.id}">
                            <td class="px-6 py-4"><p class="font-semibold text-textMain">${article.title}</p></td>
                            <td class="px-6 py-4"><span class="bg-gray-100 text-gray-600 px-2.5 py-1 rounded-md text-xs font-semibold">${article.category || '-'}</span></td>
                            <td class="px-6 py-4 text-textMuted">${date}</td>
                            <td class="px-6 py-4 text-textMain font-semibold">${article.author || '-'}</td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="alert('Fitur edit sedang dalam pengembangan')" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" title="Edit">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="deleteArticle(${article.id})" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Hapus">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>`);
                    });
                })
                .catch(() => {
                    document.getElementById('article-table-body').innerHTML =
                        '<tr><td colspan="5" class="text-center py-4 text-red-500">Failed to load articles.</td></tr>';
                });
        }

        function deleteArticle(id) {
            if (!confirm('Yakin ingin menghapus artikel ini?')) return;
            fetch(`../api/delete_article.php?id=${id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const row = document.getElementById(`article-row-${id}`);
                        if (row) row.remove();
                    } else {
                        alert('Gagal menghapus: ' + data.message);
                    }
                });
        }

        document.getElementById('addArticleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = {};
            formData.forEach((v, k) => data[k] = v);

            fetch('../api/add_article.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.success) {
                    alert('Artikel berhasil dipublikasikan!');
                    document.getElementById('modalArtikel').classList.add('hidden');
                    this.reset();
                    fetchArticles();
                } else {
                    alert('Error: ' + resData.message);
                }
            });
        });

        document.addEventListener('DOMContentLoaded', fetchArticles);
    </script>
</body>
</html>
