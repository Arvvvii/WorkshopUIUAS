<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F72585',
                        textMain: '#111827',
                        textMuted: '#6B7280',

                        bgAlt: '#F9FAFB',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],

</head>
<body class="font-montserrat text-textMain bg-bgAlt">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 h-screen fixed left-0 top-0 flex flex-col z-20">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <a href="dashboard.html" class="font-poppins font-bold text-2xl tracking-wide text-textMain">
                BLINK<span class="text-primary">CO</span> <span class="text-xs font-bold text-textMuted ml-1 uppercase tracking-wider">Admin</span>
            </a>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mt-6 mb-2">Management</p>
            <a href="kelola-produk.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Produk
            </a>
            <a href="kelola-transaksi.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Transaksi

            <a href="kelola-artikel.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                Artikel
            </a>
            <a href="kelola-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Pengguna
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <a href="../login.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>

    <!-- Main Content -->
    <main class="ml-64 min-h-screen">
        <!-- Top Header -->
        <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="font-poppins font-bold text-xl text-textMain">Overview Dashboard</h2>
            
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 rounded-full bg-bgAlt border border-gray-100 flex items-center justify-center text-textMuted hover:text-primary transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
                    <div class="w-10 h-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-sm">A</div>
                    <div class="hidden md:block">
                        <p class="text-sm font-bold text-textMain leading-tight">Admin Andy</p>
                        <p class="text-xs text-textMuted font-medium">Superadmin</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-8">
            
            <!-- 4 Stat Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Card 1 -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <span class="text-xs font-bold text-green-500 bg-green-50 px-2.5 py-1 rounded-md">+12.5%</span>
                    </div>
                    <p class="text-sm text-textMuted font-semibold mb-1">Total Sales</p>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">Rp 48,500,000</h3>
                </div>
                
                <!-- Card 2 -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        </div>
                        <span class="text-xs font-bold text-green-500 bg-green-50 px-2.5 py-1 rounded-md">+8.2%</span>
                    </div>
                    <p class="text-sm text-textMuted font-semibold mb-1">Total Orders</p>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">342</h3>
                </div>
                
                <!-- Card 3 -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        </div>
                        <span class="text-xs font-bold text-green-500 bg-green-50 px-2.5 py-1 rounded-md">+24.0%</span>
                    </div>
                    <p class="text-sm text-textMuted font-semibold mb-1">New Users</p>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">1,204</h3>
                </div>
                
                <!-- Card 4 -->
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-full bg-yellow-50 text-yellow-500 flex items-center justify-center">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        </div>
                        <span class="text-xs font-bold text-red-500 bg-red-50 px-2.5 py-1 rounded-md">-1.5%</span>
                    </div>
                    <p class="text-sm text-textMuted font-semibold mb-1">Products Out of Stock</p>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">8</h3>
                </div>
            </div>

            <!-- Chart Placeholder Area -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-poppins font-bold text-lg text-textMain">Revenue Overview</h3>
                    <select class="bg-bgAlt border border-gray-200 text-sm font-medium rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary/20">
                        <option>This Week</option>
                        <option>This Month</option>
                        <option>This Year</option>
                    </select>
                </div>
                <div class="w-full h-80 bg-bgAlt rounded-xl border border-gray-100 flex items-center justify-center flex-col">
                    <img src="https://placehold.co/800x300/F3F4F6/9CA3AF?text=Interactive+Chart+Area" alt="Chart Placeholder" class="w-full h-full object-contain mix-blend-multiply opacity-70">
                </div>
