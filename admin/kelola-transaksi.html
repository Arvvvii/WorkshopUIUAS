<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Transaksi | Admin BLINKCO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F72585',
                        textMain: '#111827',
                        textMuted: '#6B7280',
                        bgMain: '#FFFFFF',
                        bgAlt: '#F9FAFB',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-montserrat text-textMain bg-bgAlt">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 h-screen fixed left-0 top-0 flex flex-col z-20">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <a href="dashboard.html" class="font-poppins font-bold text-2xl tracking-wide text-textMain">
                BLINK<span class="text-primary">CO</span> <span class="text-xs font-bold text-textMuted ml-1 uppercase tracking-wider">Admin</span>
            </a>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-wider mt-6 mb-2">Management</p>
            <a href="kelola-produk.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Produk
            </a>
            <a href="kelola-transaksi.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Transaksi
            </a>
            <a href="kelola-artikel.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                Artikel
            </a>
            <a href="kelola-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Pengguna
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 min-h-screen">
        <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-10">
            <h2 class="font-poppins font-bold text-xl text-textMain">Kelola Transaksi</h2>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
                    <div class="w-10 h-10 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold text-sm">A</div>
                    <div class="hidden md:block">
                        <p class="text-sm font-bold text-textMain leading-tight">Admin Andy</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-poppins font-bold text-2xl text-textMain">Daftar Transaksi</h3>
                    <p class="text-sm text-textMuted font-medium mt-1">Review and manage all user orders.</p>
                </div>
                <button onclick="loadOrders()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm font-semibold hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh
                </button>
            </div>

            <!-- Table Card -->
            <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-bgAlt border-b border-gray-100 text-xs uppercase tracking-wider text-textMuted font-bold">
                                <th class="px-6 py-4">Order ID</th>
                                <th class="px-6 py-4">Pengguna</th>
                                <th class="px-6 py-4">Items</th>
                                <th class="px-6 py-4">Total</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Update Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-gray-100 font-medium text-sm">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-textMuted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Update Order -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                <h3 class="font-poppins font-bold text-xl text-textMain">Update Transaksi</h3>
                <button type="button" onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="editOrderForm" class="space-y-5">
                <input type="hidden" id="edit-order-id">
                
                <div>
                    <label class="block text-sm font-semibold text-textMain mb-2">Order ID</label>
                    <input type="text" id="edit-order-display" disabled class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 font-medium">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-textMain mb-2">Status Pesanan</label>
                    <select id="edit-status" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-white font-medium text-textMain">
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="processing">Processing</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-textMain mb-2">No Resi (Tracking Number)</label>
                    <input type="text" id="edit-tracking-number" placeholder="Contoh: RESI-123456789" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/20 bg-white font-medium text-textMain">
                    <p class="text-xs text-textMuted mt-1">Kosongkan jika belum dikirim.</p>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-gray-100">
                    <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">Batal</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-primary hover:bg-[#e01970] transition-colors flex items-center gap-2">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function formatRupiah(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        }

        function statusBadge(status) {
            const map = {
                paid:       'bg-green-100 text-green-700',
                shipped:    'bg-blue-100 text-blue-700',
                delivered:  'bg-purple-100 text-purple-700',
                processing: 'bg-yellow-100 text-yellow-700',
                pending:    'bg-gray-100 text-gray-600',
                cancelled:  'bg-red-100 text-red-600',
            };
            const cls = map[status] || 'bg-gray-100 text-gray-600';
            return `<span class="${cls} text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wide">${status}</span>`;
        }

        function openEditModal(orderId) {
            const modal = document.getElementById('editModal');
            const content = document.getElementById('modalContent');
            
            // fetch data pesanan untuk ambil nomor resi yang sudah ada
            fetch(`../api/get_order_detail.php?id=${orderId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('edit-order-id').value = orderId;
                        document.getElementById('edit-order-display').value = '#' + orderId;
                        document.getElementById('edit-status').value = data.data.status;
                        document.getElementById('edit-tracking-number').value = data.data.tracking_number || '';
                        
                        modal.classList.remove('hidden');
                        setTimeout(() => content.classList.remove('scale-95'), 10);
                    } else {
                        alert('Gagal mengambil detail pesanan: ' + data.message);
                    }
                })
                .catch(err => {
                    alert('Terjadi kesalahan saat mengambil detail pesanan.');
                    console.error(err);
                });
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            const content = document.getElementById('modalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        document.getElementById('editOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const orderId = document.getElementById('edit-order-id').value;
            const newStatus = document.getElementById('edit-status').value;
            const trackingNum = document.getElementById('edit-tracking-number').value;

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Menyimpan...';

            fetch('../api/update_order.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: newStatus, tracking_number: trackingNum })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    closeEditModal();
                    loadOrders(); // reload table
                } else {
                    alert('Gagal update status: ' + data.message);
                }
            })
            .catch(() => alert('Terjadi error saat update status.'))
            .finally(() => { 
                submitBtn.disabled = false; 
                submitBtn.innerHTML = 'Simpan Perubahan';
            });
        });

        function loadOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-textMuted">Loading...</td></tr>';

            fetch('../api/get_orders.php')
                .then(r => r.json())
                .then(data => {
                    if (!data.success || data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-textMuted">Belum ada transaksi.</td></tr>';
                        return;
                    }

                    const statuses = ['pending', 'paid', 'processing', 'shipped', 'delivered', 'cancelled'];

                    tbody.innerHTML = data.data.map(order => {
                        const date = new Date(order.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                        const items = order.items_summary || '-';
                        const options = statuses.map(s =>
                            `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
                        ).join('');

                        return `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4">
                                <p class="font-semibold text-textMain">#${order.id}</p>
                                <p class="text-xs text-textMuted">${date}</p>
                            </td>
                            <td class="px-6 py-4">
                                <p class="font-semibold text-textMain">${order.user_name || '-'}</p>
                                <p class="text-xs text-textMuted">${order.user_email || ''}</p>
                            </td>
                            <td class="px-6 py-4 max-w-[200px]">
                                <p class="text-xs text-textMuted truncate" title="${items}">${items}</p>
                            </td>
                            <td class="px-6 py-4 font-bold text-textMain">${formatRupiah(order.total_price)}</td>
                            <td class="px-6 py-4 status-badge-cell">${statusBadge(order.status)}</td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="openEditModal(${order.id})" class="text-xs font-semibold px-4 py-2 border border-gray-200 rounded-lg text-textMain hover:bg-gray-100 transition-colors">
                                    Edit Resi & Status
                                </button>
                            </td>
                        </tr>`;
                    }).join('');
                })
                .catch(() => {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-400">Gagal memuat data transaksi.</td></tr>';
                });
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
