    <!-- Main Content -->
    <div class="container mx-auto px-4 lg:px-8 py-12 min-h-[60vh]">
        <h1 class="font-poppins font-bold text-3xl mb-8 text-textMain">Shopping Cart</h1>
        
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left: Cart Items -->
            <div class="w-full lg:w-2/3" id="cart-container">
                <!-- Items injected by JS -->
            </div>

            <!-- Right: Order Summary -->
            <div class="w-full lg:w-1/3">
                <div class="bg-bgAlt border border-gray-100 rounded-2xl p-6 shadow-sm sticky top-28">
                    <h2 class="font-poppins font-semibold text-lg mb-6">Order Summary</h2>
                    <div class="flex justify-between mb-4 text-sm font-medium text-textMuted">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">Rp 0</span>
                    </div>
                    <div class="flex justify-between mb-6 text-sm font-medium text-textMuted pb-6 border-b border-gray-200">
                        <span>Estimated Shipping</span>
                        <span class="text-green-600">Free</span>
                    </div>
                    <div class="flex justify-between mb-8 font-semibold text-xl text-textMain">
                        <span>Total</span>
                        <span id="summary-total">Rp 0</span>
                    </div>
                    
                    <a href="pembayaran.html" id="checkout-btn" class="w-full block text-center bg-primary text-white font-semibold py-4 rounded-xl hover:bg-[#e01970] transition-colors shadow-soft">
                        Proceed to Checkout
                    </a>
                    
                    <a href="katalog.html" class="w-full block text-center text-textMuted font-medium text-sm mt-4 hover:text-primary transition-colors">
                        Continue Shopping

                </div>

    <!-- Clean Footer -->
    <footer class="bg-darkFooter text-gray-300 py-12">
        <div class="container mx-auto px-4 lg:px-8">
            <div class="border-t border-gray-700 pt-8 flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-gray-400">
                <p>&copy; 2026 BLINKCO. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JS References -->
    <script src="js/script.js?v=1.3"></script>
    <script>
        window.changeQty = function(id, delta) {
            const cartStr = localStorage.getItem('blinkco_cart');
            if (cartStr) {
                let cart = JSON.parse(cartStr);
                if (Array.isArray(cart)) {
                    const item = cart.find(i => i.id === id);
                    if (item) {
                        item.qty += delta;
                        if (item.qty < 1) item.qty = 1;
                        localStorage.setItem('blinkco_cart', JSON.stringify(cart));
                        renderCart();
                        if(typeof updateCartBadge === 'function') updateCartBadge();
                    }
                }
            }
        };

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function renderCart() {
            const cartStr = localStorage.getItem('blinkco_cart');
            const cartContainer = document.getElementById('cart-container');
            const subtotalEl = document.getElementById('summary-subtotal');
            const totalEl = document.getElementById('summary-total');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            let cart = cartStr ? JSON.parse(cartStr) : [];
            if (!Array.isArray(cart)) cart = [];
            
            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="bg-white border border-gray-100 rounded-2xl p-12 text-center shadow-sm">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        </div>
                        <h3 class="font-poppins font-semibold text-xl mb-2 text-textMain">Your cart is empty</h3>
                        <p class="text-textMuted mb-6 font-medium">Looks like you haven't added anything yet.</p>
                        <a href="katalog.html" class="inline-block bg-textMain text-white font-semibold py-3 px-8 rounded-xl hover:bg-gray-800 transition-colors">Start Shopping</a>
                    </div>
                `;
                subtotalEl.textContent = 'Rp 0';
                totalEl.textContent = 'Rp 0';
                checkoutBtn.classList.add('opacity-50', 'pointer-events-none');
                return;
            }

            checkoutBtn.classList.remove('opacity-50', 'pointer-events-none');
            
            let html = '<div class="space-y-4">';
            let total = 0;
            
            cart.forEach(item => {
                total += item.price * item.qty;
                const minusDisabled = item.qty <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-200';
                
                let displayName = item.name;
                let variantBadgeHtml = '';
                
                if (item.name.includes(' - ')) {
                    const parts = item.name.split(' - ');
                    displayName = parts[0];
                    const variantName = parts.slice(1).join(' - ');
                    variantBadgeHtml = `<div class="mt-1"><span class="inline-block bg-gray-100 text-textMuted text-xs font-semibold px-2.5 py-1 rounded-md">Varian: ${variantName}</span></div>`;
                }

                html += `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row gap-4 items-center">
                        <div class="w-full sm:w-24 aspect-square bg-gray-50 rounded-xl overflow-hidden flex-shrink-0">
                            <img src="${item.image || 'https://placehold.co/200x200/f3f4f6/9CA3AF?text=Merch'}" alt="Product" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-grow text-center sm:text-left">
                            <h3 class="font-poppins font-semibold text-textMain">${displayName}</h3>
                            ${variantBadgeHtml}
                            <p class="text-primary font-semibold mt-1">${formatRupiah(item.price)}</p>
                            <div class="flex items-center justify-center sm:justify-start gap-3 mt-3">
                                <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition-colors ${minusDisabled}" ${item.qty <= 1 ? 'disabled' : ''}>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                                </button>
                                <span class="font-semibold text-sm w-4 text-center">${item.qty}</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="flex-shrink-0 mt-2 sm:mt-0">
                            <button onclick="removeItem('${item.id}')" class="text-sm font-medium text-red-500 hover:text-red-600 hover:underline px-4 py-2 border border-red-100 bg-red-50 rounded-lg transition-colors">
                                Remove
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            cartContainer.innerHTML = html;
            subtotalEl.textContent = formatRupiah(total);
            totalEl.textContent = formatRupiah(total);
        }

        window.removeItem = function(id) {
            const cartStr = localStorage.getItem('blinkco_cart');
            if (cartStr) {
                let cart = JSON.parse(cartStr);
                if (Array.isArray(cart)) {
                    cart = cart.filter(item => item.id !== id);
                    localStorage.setItem('blinkco_cart', JSON.stringify(cart));
                    renderCart();
                    if(typeof updateCartBadge === 'function') updateCartBadge();
                }
            }
        };

        // Initial render
        renderCart();
    </script>
</body>
