    <!-- Floating Toast Container -->
    <div id="local-toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // Custom Local Toast System
        function showLocalToast(title, subtitle, isError = false) {
            const container = document.getElementById('local-toast-container');
            const toast = document.createElement('div');
            toast.className = [
                'bg-white border border-gray-100 rounded-2xl p-4',
                'flex items-center gap-4',
                'shadow-[0_8px_30px_rgb(0,0,0,0.08)]',
                'transform transition-all duration-300 translate-y-12 opacity-0',
                'pointer-events-auto min-w-[300px] max-w-sm'
            ].join(' ');

            const iconColor = isError ? 'text-red-500 bg-red-50' : 'text-green-500 bg-green-50';
            const iconSvg = isError 
                ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>'
                : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>';

            toast.innerHTML = `
                <div class="w-10 h-10 ${iconColor} rounded-full flex items-center justify-center flex-shrink-0">
                    ${iconSvg}
                </div>
                <div class="flex-grow min-w-0">
                    <h4 class="font-poppins font-semibold text-sm text-gray-900 leading-tight">${title}</h4>
                    ${subtitle ? `<p class="text-xs text-gray-500 font-medium mt-0.5 truncate">${subtitle}</p>` : ''}
                </div>
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 flex-shrink-0" aria-label="Close">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>`;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => toast.classList.remove('translate-y-12', 'opacity-0'));
            });

            setTimeout(() => {
                if (document.body.contains(toast)) {
                    toast.classList.add('translate-y-12', 'opacity-0');
                    setTimeout(() => { if (document.body.contains(toast)) toast.remove(); }, 300);
                }
            }, 3500);
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const btnProfile = document.getElementById('btn-tab-profile');
            const btnAddress = document.getElementById('btn-tab-address');
            const btnSecurity = document.getElementById('btn-tab-security');
            const panelProfile = document.getElementById('panel-profile');
            const panelAddress = document.getElementById('panel-address');
            const panelSecurity = document.getElementById('panel-security');

            const inactiveClass = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:bg-gray-50 hover:text-textMain font-semibold text-sm transition-all focus:outline-none text-left';
            const activeClass = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold text-sm transition-all focus:outline-none text-left';

            btnProfile.className = inactiveClass;
            btnAddress.className = inactiveClass;
            btnSecurity.className = inactiveClass;
            panelProfile.classList.add('hidden');
            panelAddress.classList.add('hidden');
            panelSecurity.classList.add('hidden');

            if (tab === 'profile') {
                btnProfile.className = activeClass;
                panelProfile.classList.remove('hidden');
            } else if (tab === 'address') {
                btnAddress.className = activeClass;
                panelAddress.classList.remove('hidden');
            } else if (tab === 'security') {
                btnSecurity.className = activeClass;
                panelSecurity.classList.remove('hidden');
            }
        }

        // Logout
        window.handleLogout = function() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('blinkco_user');
            showLocalToast('Log Out Berhasil', 'Mengarahkan ke halaman utama...');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        };

        // Unified Profile Update Helper
        function saveUserData(updatedFields, successMessage, btn) {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) return;
            const user = JSON.parse(userStr);

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Menyimpan...';

            const payload = {
                user_id: user.id,
                name: document.getElementById('input-name').value.trim(),
                email: document.getElementById('input-email').value.trim(),
                phone: document.getElementById('input-phone').value.trim(),
                gender: document.getElementById('input-gender').value,
                birthdate: document.getElementById('input-birthdate').value,
                address_name: document.getElementById('input-addr-name').value.trim(),
                address_phone: document.getElementById('input-addr-phone').value.trim(),
                address_province: document.getElementById('input-addr-province').value.trim(),
                address_city: document.getElementById('input-addr-city').value.trim(),
                address_postal_code: document.getElementById('input-addr-postal').value.trim(),
                address_detail: document.getElementById('input-addr-detail').value.trim(),
                ...updatedFields
            };

            fetch('api/update_profile.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = originalText;

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('blinkco_user', JSON.stringify({ isLoggedIn: true, ...data.user }));

                    // Update UI details
                    document.getElementById('profile-initial').textContent = payload.name.charAt(0).toUpperCase();
                    document.getElementById('profile-name-sidebar').textContent = payload.name;
                    document.getElementById('profile-email-sidebar').textContent = payload.email;

                    showLocalToast('Berhasil!', successMessage);
                } else {
                    showLocalToast('Gagal Memperbarui', data.message, true);
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = originalText;
                showLocalToast('Error Sistem', 'Terjadi kesalahan saat menghubungi server.', true);
                console.error(err);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            if (!userStr) return;

            const user = JSON.parse(userStr);

            // Populate static UI
            document.getElementById('profile-initial').textContent = (user.name || 'U').charAt(0).toUpperCase();
            document.getElementById('profile-name-sidebar').textContent = user.name || 'User';
            document.getElementById('profile-email-sidebar').textContent = user.email || '';
            document.getElementById('profile-role').textContent = user.role || 'user';
            
            const joinDate = user.created_at ? new Date(user.created_at) : new Date();
            document.getElementById('profile-join-date').textContent = joinDate.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

            // Prefill Profile Inputs
            document.getElementById('input-name').value = user.name || '';
            document.getElementById('input-email').value = user.email || '';
            document.getElementById('input-phone').value = user.phone || '';
            document.getElementById('input-gender').value = user.gender || '';
            document.getElementById('input-birthdate').value = user.birthdate || '';

            // Prefill Address Inputs
            document.getElementById('input-addr-name').value = user.address_name || '';
            document.getElementById('input-addr-phone').value = user.address_phone || '';
            document.getElementById('input-addr-province').value = user.address_province || '';
            document.getElementById('input-addr-city').value = user.address_city || '';
            document.getElementById('input-addr-postal').value = user.address_postal_code || '';
            document.getElementById('input-addr-detail').value = user.address_detail || '';

            // Handle Profile Update Submission
            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-profile');
                saveUserData({}, 'Profil Anda berhasil diperbarui.', btn);
            });

            // Handle Address Update Submission
            document.getElementById('addressForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-address');
                saveUserData({}, 'Alamat pengiriman berhasil diperbarui.', btn);
            });

            // Handle Security/Password Update Submission
            document.getElementById('securityForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const currPass = document.getElementById('input-curr-pass').value;
                const newPass = document.getElementById('input-new-pass').value;
                const confirmPass = document.getElementById('input-confirm-pass').value;

                if (newPass.length < 6) {
                    showLocalToast('Validasi Gagal', 'Password baru minimal harus 6 karakter.', true);
                    return;
                }

                if (newPass !== confirmPass) {
                    showLocalToast('Validasi Gagal', 'Konfirmasi password baru tidak cocok.', true);
                    return;
                }

                const btn = document.getElementById('btn-submit-security');
                btn.disabled = true;
                btn.textContent = 'Mengganti...';

                fetch('api/update_profile.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        name: user.name,
                        email: user.email,
                        current_password: currPass,
                        new_password: newPass
                    })
                })
                .then(r => r.json())
                .then(data => {
                    btn.disabled = false;
                    btn.textContent = 'Ganti Password';

                    if (data.success) {
                        showLocalToast('Kata Sandi Diubah!', 'Password akun Anda berhasil diganti.');
                        document.getElementById('securityForm').reset();
                    } else {
                        showLocalToast('Gagal Ganti Password', data.message, true);
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.textContent = 'Ganti Password';
                    showLocalToast('Error Sistem', 'Terjadi kesalahan saat menghubungi server.', true);
                    console.error(err);
                });
            });
        });
    </script>
    <script src="js/script.js?v=1.3"></script>
</body>
</html>
